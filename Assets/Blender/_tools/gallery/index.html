<!doctype html>
<meta charset="utf-8">
<title>Gloomfell → suite</title>
<!-- The v1–v3 gallery lived here. It read iteration-log.json, which the v4
     pipeline no longer writes, so this page could only ever show stale data.
     Everything moved into the suite (v4.html); this stub keeps old bookmarks
     working and maps the old ?asset= deep link onto the suite's router. -->
<script>
  var a = new URLSearchParams(location.search).get('asset');
  location.replace('/v4.html' + (a ? '#/a/' + encodeURIComponent(a) : ''));
</script>
<meta http-equiv="refresh" content="0;url=/v4.html">
<p>The gallery moved into <a href="/v4.html">the Gloomfell suite</a>.</p>
