<!doctype html>
<meta charset="utf-8">
<title>Gloomfell · preview gallery</title>
<style>
  :root { color-scheme: dark; --bg:#131317; --card:#1c1c22; --line:#2e2e38;
          --dim:#8b8b99; --fg:#e8e8ef; --bad:#c8443c; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:12px 20px; display:flex; gap:16px; align-items:baseline; z-index:2; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  .dim { color:var(--dim); }
  .cols { display:flex; gap:16px; padding:20px; align-items:flex-start;
          overflow-x:auto; }
  .col { background:var(--card); border:1px solid var(--line); border-radius:8px;
         padding:12px; min-width:220px; flex:0 0 auto; }
  .col h2 { font-size:13px; margin:0 0 2px; }
  .num { display:inline-block; min-width:20px; height:20px; line-height:20px;
         text-align:center; background:var(--fg); color:var(--bg);
         border-radius:4px; font-weight:700; margin-right:6px; }
  .diff { font:11px/1.4 ui-monospace, Consolas, monospace; color:var(--dim);
          margin:6px 0 10px; white-space:pre-wrap; }
  .col img { display:block; width:100%; border-radius:4px; margin-bottom:8px;
             background:#000; cursor:zoom-in; }
  .err { border-color:var(--bad); }
  .err pre { font:11px/1.4 ui-monospace, Consolas, monospace; color:#ffb4ae;
             background:#2a1614; padding:8px; border-radius:4px; margin:0;
             max-height:260px; overflow:auto; white-space:pre-wrap; }
  .pending { color:var(--dim); font-style:italic; padding:24px 0; text-align:center; }
  .badge { font:11px/1 ui-monospace, Consolas, monospace; padding:4px 8px;
           border-radius:4px; margin-left:auto; }
  .badge.ok  { background:#1d3a24; color:#7ee08e; }
  .badge.bad { background:#3a1a17; color:#ffb4ae; }
  details { margin:0 20px 12px; }
  summary { cursor:pointer; color:var(--dim); padding:6px 0; }
  /* Progression mode - shown instead of .cols when an iterator subagent is
     working this asset. One round per run, so side-by-side columns are the
     wrong shape; what matters is the current state plus the trajectory. */
  .prog { padding:20px; }
  .prog-now { display:flex; gap:20px; align-items:flex-start; }
  .prog-now img { max-width:min(560px, 60vw); border-radius:8px; background:#000;
                  cursor:zoom-in; }
  /* Capped, not flex:1 - stretching this to the viewport strands the caption
     metres away from the image it describes on a wide monitor. */
  .prog-why { flex:0 1 420px; min-width:200px; }
  .prog-why h2 { font-size:14px; margin:0 0 8px; font-weight:600; }
  .prog-why p { color:var(--dim); margin:0 0 12px; }
  .strip { display:flex; gap:10px; margin-top:22px; padding-bottom:8px;
           overflow-x:auto; }
  .thumb { flex:0 0 auto; width:104px; }
  .thumb img { width:100%; border-radius:4px; background:#000; cursor:zoom-in;
               display:block; }
  .thumb span { display:block; font:11px/1.4 ui-monospace, Consolas, monospace;
                color:var(--dim); margin-top:4px; }
  /* A rejected attempt is kept visible on purpose: seeing what the director
     threw away, and why, is how you tell real iteration from churn. */
  .thumb.rejected img { opacity:.35; outline:1px solid var(--bad); }
  .thumb.rejected span { color:var(--bad); }
  .crit { font:11px/1.4 ui-monospace, Consolas, monospace; color:#ffb4ae;
          background:#2a1614; padding:8px; border-radius:4px; margin:10px 0 0;
          white-space:pre-wrap; }
  .state { font:11px/1 ui-monospace, Consolas, monospace; padding:4px 8px;
           border-radius:4px; }
  .state.run   { background:#1d2f3a; color:#7ec8e0; }
  .state.stuck { background:#3a2f17; color:#e0c07e; }
  dialog { border:none; background:transparent; max-width:96vw; max-height:96vh; }
  dialog img { max-width:96vw; max-height:96vh; }
  dialog::backdrop { background:#000c; }
</style>

<header>
  <h1 id="title">waiting for a build…</h1>
  <span class="dim" id="sub"></span>
  <span id="audit"></span>
</header>
<div id="prog"></div>
<div id="live"></div>
<div id="history"></div>
<dialog id="zoom"><img></dialog>

<script>
// Poll latest.json once a second. Re-render whenever the BODY changes, not just
// when the run number does: the manifest is rewritten several times within a
// run as each variant lands, and we want those to appear as they arrive.
//
// lastBody is only ever assigned AFTER body is confirmed to parse (see tick()).
// A truncated HTTP read - a dropped connection mid-response, which is not
// covered by the atomic-write protection on the server side, since that only
// guards against reading a half-written FILE, not a half-delivered response -
// must be skippable, not something that poisons every future tick. lastRun is
// kept alongside as a plain value instead of re-parsing lastBody each time.
//
// `asset` is which asset the page is currently showing. It is NOT resolved once
// and kept - tick() re-reads assets.json every second and switches when the
// newest build changes. See the switch block in tick() for what has to be reset
// when it does.
let lastBody = null, lastRun = null, asset = null;

const q = p => p + (p.includes('?') ? '&' : '?') + 't=' + Date.now();

// Escape before any JSON-sourced text goes into innerHTML/insertAdjacentHTML.
// Applied at every such site (labels, diff entries, stderr, run timestamps) -
// without it, a `<` anywhere in a variant's data would inject markup instead
// of rendering as text.
const esc = s => String(s).replace(/[<&]/g, c => ({'<':'&lt;','&':'&amp;'}[c]));

async function findAsset() {
  // preview.py maintains assets.json, most-recently-built first. We cannot
  // scrape a directory listing instead: http.server serves index.html when one
  // is present, so GET / returns this very page.
  //
  // Called once per tick, so the page follows whatever was built most recently.
  // ?asset=<name> pins it instead, and wins outright - that override is the way
  // to keep an older asset on screen while another one is being built.
  const override = new URLSearchParams(location.search).get('asset');
  if (override) return override;
  const res = await fetch(q('/assets.json'));
  if (!res.ok) return null;
  const list = await res.json();
  return list.length ? list[0] : null;
}

function card(v) {
  const el = document.createElement('div');
  el.className = 'col' + (v.exit !== 0 && v.exit !== null ? ' err' : '');
  const diff = Object.entries(v.diff || {})
      .map(([k, val]) => `${esc(k)} = ${esc(JSON.stringify(val))}`).join('\n');
  el.innerHTML = `<h2><span class="num">${v.n}</span>${esc(v.label)}</h2>`
    + (diff ? `<div class="diff">${diff}</div>` : '<div class="diff dim">baseline</div>');

  if (v.exit === null) {
    el.insertAdjacentHTML('beforeend', '<div class="pending">building…</div>');
  } else if (v.exit !== 0) {
    el.insertAdjacentHTML('beforeend',
      `<pre>exit ${v.exit}\n\n${esc(v.stderr_tail || '(no stderr)')}</pre>`);
  } else {
    for (const r of v.renders) {
      const img = new Image();
      img.src = q(`/${asset}/${v.runDir}/${r}`);
      img.loading = 'lazy';
      img.onclick = () => {
        const d = document.getElementById('zoom');
        d.querySelector('img').src = img.src;
        d.showModal();
      };
      el.appendChild(img);
    }
    if (v.seconds !== null)
      el.insertAdjacentHTML('beforeend', `<div class="diff">${v.seconds}s</div>`);
  }
  return el;
}

function renderRun(m, into) {
  // Full, one-shot render: used for history entries, which are rendered once
  // when their <details> is created and never updated again afterwards. The
  // live section below needs a different, incremental version of this same
  // idea - see renderLive().
  const wrap = document.createElement('div');
  wrap.className = 'cols';
  for (const v of m.variants) {
    v.runDir = 'run-' + String(m.run).padStart(3, '0');
    wrap.appendChild(card(v));
  }
  into.appendChild(wrap);
}

// What #live is currently showing, so a same-run manifest rewrite (the
// runner rewrites the manifest once per variant as it lands - see preview.py)
// can patch only the card(s) whose own state changed, instead of tearing down
// and recreating every column. Recreating every <img> on every rewrite would
// force a real network re-fetch of every already-loaded image each time
// (each gets a fresh q()-appended cache-buster), which is quadratic in
// variant count for images that never changed.
let liveRun = null;
let liveCards = [];       // card elements currently in #live, indexed by v.n - 1
let liveSignatures = [];  // what each of those cards was rendered from

function variantSignature(v) {
  // Only the fields that change what the card actually looks like. `seconds`
  // lands in the same rewrite as `exit` flipping away from null, so it's
  // already covered without being named explicitly.
  return JSON.stringify([v.exit, v.renders]);
}

function renderLive(m) {
  const live = document.getElementById('live');
  if (m.run !== liveRun) {
    // A new run: there is nothing sensible to diff against, so rebuild
    // wholesale. This is also the very first tick's path (liveRun starts null).
    live.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'cols';
    liveCards = [];
    liveSignatures = [];
    for (const v of m.variants) {
      v.runDir = 'run-' + String(m.run).padStart(3, '0');
      const el = card(v);
      wrap.appendChild(el);
      liveCards.push(el);
      liveSignatures.push(variantSignature(v));
    }
    live.appendChild(wrap);
    liveRun = m.run;
    return;
  }
  // Same run, rewritten because one variant finished: swap in only the
  // card(s) whose signature actually changed. Everything else - in
  // particular any <img> that already loaded - is left completely alone.
  for (const v of m.variants) {
    v.runDir = 'run-' + String(m.run).padStart(3, '0');
    const sig = variantSignature(v);
    if (sig === liveSignatures[v.n - 1]) continue;
    const el = card(v);
    liveCards[v.n - 1].replaceWith(el);
    liveCards[v.n - 1] = el;
    liveSignatures[v.n - 1] = sig;
  }
}

// ---------------------------------------------------------------------------
// Progression mode
//
// A director subagent writes <asset>/iteration-log.json, one entry per ATTEMPT -
// not per accepted change. Rejected attempts stay in the list on purpose: the
// point of a separate verifier is that you can see what it threw away and why.
//
// While that file exists it OWNS the page. A loop produces one variant per run,
// so the comparison view would show a single lonely column and bury the actual
// story - the trajectory - inside collapsed <details>.
//
// The big image is the LATEST attempt whatever its verdict, badged accordingly.
// That is the honest answer to "what does the model look like right now": a
// worker revises on top of its own rejected attempt, so the rejected render is
// genuinely the current on-disk state until the revision lands.
// ---------------------------------------------------------------------------
let lastLogBody = null;

function zoomable(img) {
  img.onclick = () => {
    const d = document.getElementById('zoom');
    d.querySelector('img').src = img.src;
    d.showModal();
  };
  return img;
}

function attemptLabel(a) {
  // "7.2" reads as iteration 7, attempt 2. Attempt is omitted when it is the
  // only one, which is the common case and would otherwise be noise.
  return a.attempt && a.attempt > 1 ? `${a.iteration}.${a.attempt}` : `${a.iteration}`;
}

function renderProgression(log) {
  const attempts = log.attempts || [];
  const host = document.getElementById('prog');
  host.innerHTML = '';
  if (!attempts.length) {
    host.innerHTML = '<div class="pending">director started, no attempts yet…</div>';
    return;
  }
  const current = attempts[attempts.length - 1];
  const rejected = current.verdict === 'rejected';

  const now = document.createElement('div');
  now.className = 'prog-now';
  const big = zoomable(new Image());
  big.src = q(`/${asset}/${current.render}`);
  now.appendChild(big);

  const why = document.createElement('div');
  why.className = 'prog-why';
  why.innerHTML = `<h2>iteration ${attemptLabel(current)}</h2>`
    + `<p>${esc(current.summary || '')}</p>`
    + `<span class="badge ${rejected ? 'bad' : 'ok'}">`
    + `${esc(current.verdict || 'pending')}</span>`
    + (current.audit ? ` <span class="badge ${current.audit.includes('FAIL')
        ? 'bad' : 'ok'}">${esc(current.audit)}</span>` : '')
    + (rejected && current.critique
        ? `<p class="crit">${esc(current.critique)}</p>` : '');
  now.appendChild(why);
  host.appendChild(now);

  const strip = document.createElement('div');
  strip.className = 'strip';
  for (const a of [...attempts].reverse()) {
    if (a === current) continue;
    const bad = a.verdict === 'rejected';
    const t = document.createElement('div');
    t.className = 'thumb' + (bad ? ' rejected' : '');
    const img = zoomable(new Image());
    img.src = q(`/${asset}/${a.render}`);
    img.loading = 'lazy';
    // Hover gives the full reasoning without spending vertical space on it.
    img.title = (a.summary || '') + (bad && a.critique ? `\n\nrejected: ${a.critique}` : '');
    t.appendChild(img);
    const cap = document.createElement('span');
    cap.textContent = (bad ? '✕ ' : '') + attemptLabel(a) + ' · ' + (a.summary || '');
    t.appendChild(cap);
    strip.appendChild(t);
  }
  host.appendChild(strip);

  document.getElementById('title').textContent =
    `${log.asset} · iteration ${log.iteration}`;
  const sub = document.getElementById('sub');
  sub.innerHTML = `<span class="state ${log.state === 'run' ? 'run' : 'stuck'}">`
    + `${esc(log.state || 'run')}</span>` + (log.note ? ' ' + esc(log.note) : '');
  document.getElementById('audit').textContent = '';
  document.getElementById('audit').className = '';
}

function clearComparisonView() {
  lastBody = null; lastRun = null; liveRun = null;
  liveCards = []; liveSignatures = [];
  document.getElementById('live').innerHTML = '';
  document.getElementById('history').innerHTML = '';
}

async function loadHistory(current, forAsset) {
  // Earlier runs, newest first, collapsed. This is the "watch it change" half:
  // the model's history across builds, not just its current state.
  const host = document.getElementById('history');
  host.innerHTML = '';
  for (let n = current - 1; n > 0 && n > current - 12; n--) {
    const dir = 'run-' + String(n).padStart(3, '0');
    const res = await fetch(q(`/${forAsset}/${dir}/manifest.json`));
    // The displayed asset can change under us mid-loop: tick() re-resolves it
    // every second and this function awaits between appends. Bailing out here
    // is what stops the previous asset's runs trickling into the history
    // container that switching already cleared. card() reads the global
    // `asset` for its image URLs, so past this line the two must agree.
    if (forAsset !== asset) return;
    if (!res.ok) continue;
    const m = await res.json();
    const d = document.createElement('details');
    d.innerHTML = `<summary>run ${m.run} · ${esc(m.started)} · `
      + `${m.variants.map(v => esc(v.label)).join(', ')}</summary>`;
    host.appendChild(d);
    renderRun(m, d);
  }
}

async function tick() {
  try {
    // Re-resolved EVERY tick, not cached for the page's lifetime. preview.py
    // keeps assets.json most-recently-built-first precisely so this page can
    // follow the newest build; resolving once would latch the tab onto the
    // first asset it ever saw, so previewing a second one would show the old
    // model indefinitely with nothing on screen to say so. findAsset() still
    // returns the ?asset= override unchanged when one is present, so an
    // explicitly pinned asset never moves.
    const next = await findAsset();
    if (!next) return;
    if (next !== asset) {
      // Every piece of view state is derived from the old asset, so all of it
      // has to go. Leaving lastBody/lastRun alone would make the first tick of
      // the new asset look like "nothing changed" (or like a same-run rewrite,
      // if the run numbers happened to match), and renderLive() would then
      // patch the new asset's variants into the old asset's cards.
      asset = next;
      lastLogBody = null;
      clearComparisonView();
      document.getElementById('prog').innerHTML = '';
      document.getElementById('title').textContent = `${asset} · loading…`;
      document.getElementById('sub').textContent = '';
      document.getElementById('audit').textContent = '';
      document.getElementById('audit').className = '';
    }

    // Progression mode takes precedence while an iterator is working this asset.
    const logRes = await fetch(q(`/${asset}/iteration-log.json`));
    if (logRes.ok) {
      const logBody = await logRes.text();
      if (logBody !== lastLogBody) {
        let log;
        try {
          log = JSON.parse(logBody);
        } catch (e) {
          // Same reasoning as the manifest below: a truncated read must be
          // skippable, never promoted to "last known good".
          console.debug('log poll skipped: malformed body', e);
          return;
        }
        lastLogBody = logBody;
        if (!document.getElementById('live').innerHTML) clearComparisonView();
        document.getElementById('live').innerHTML = '';
        document.getElementById('history').innerHTML = '';
        renderProgression(log);
      }
      return;                 // the log owns the page; don't also draw columns
    }
    if (lastLogBody !== null) {
      // The iterator finished and its log was removed. Drop back to the
      // comparison view rather than leaving a frozen final round on screen.
      lastLogBody = null;
      document.getElementById('prog').innerHTML = '';
      clearComparisonView();
    }

    const res = await fetch(q(`/${asset}/latest.json`));
    if (!res.ok) return;
    const body = await res.text();
    if (body === lastBody) return;          // nothing changed; leave the DOM alone

    // Parse before committing to anything. A truncated HTTP read must be
    // skippable rather than becoming the new "last known good" state: if it
    // were assigned to lastBody regardless, every later tick would try to
    // re-derive wasNewRun from that same unparseable text and throw before
    // ever reaching a line that could replace it with something valid again
    // - the poller would be wedged until a manual reload.
    let m;
    try {
      m = JSON.parse(body);
    } catch (e) {
      console.debug('poll skipped: malformed body', e);
      return;
    }
    const wasNewRun = lastRun === null || lastRun !== m.run;
    lastBody = body;
    lastRun = m.run;

    document.getElementById('title').textContent = `${m.asset} · run ${m.run}`;
    const badge = document.getElementById('audit');
    badge.textContent = m.audit || '';
    // Run level, not per variant: the audit script only ever sees the baseline.
    badge.className = m.audit
      ? (m.audit.includes('FAIL') ? 'badge bad' : 'badge ok') : '';
    document.getElementById('sub').textContent =
      m.started + (m.done ? '' : ' · building…');
    renderLive(m);
    if (wasNewRun) loadHistory(m.run, asset);
  } catch (e) {
    // A half-written manifest or a momentary 404 is expected during a run.
    // Keep the last good render on screen rather than blanking the page.
    console.debug('poll skipped:', e);
  }
}

document.getElementById('zoom').onclick = e => e.currentTarget.close();
tick();
setInterval(tick, 1000);
</script>
