<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gloomfell · preview gallery</title>
<!-- ======================================================================
     Gloomfell review gallery — single self-contained file, no external
     requests. Served by _tools/serve.py from _previews~/; restart the server
     after editing this file (it copies index.html at startup).

     Sections: TOKENS · BASE · COMPONENTS · REGIONS · VIEWER · SCRIPT
     (utils / normalize / time / watermark / signals / components / health /
      hero / lanes / shelf / comparison / viewer / poller).

     Data contract: assets.json, <asset>/latest.json, <asset>/run-NNN/manifest.json,
     <asset>/iteration-log.json (owns the page when present), <asset>/control.json
     (READ ONLY — user's file), <asset>/user-signals.jsonl (written via POST /signal).
     One normalize() is the only code that touches raw log JSON; it tolerates all
     three critique eras (stance / scored / margin) and never crashes on unknowns.
     ====================================================================== -->
<style>
/* ============================ TOKENS ================================== */
:root {
  color-scheme: dark;
  --canvas:   #101014;
  --s1:       #17171c;   /* surface-1: cards            */
  --s2:       #1e1e25;   /* surface-2: chips, insets    */
  --line:     #2a2a33;   /* hairline borders            */
  --ink:      #e7e7ee;   /* primary text (no pure white — dark-room use) */
  --ink2:     #9a9aa8;   /* secondary                   */
  --ink3:     #6b6b78;   /* faint                       */
  /* Verdict semantics — validated palette (dataviz reference instance).
     Status is ALWAYS encoded three ways: color + glyph + text label.      */
  --ok:       #0ca30c;   /* accepted                    */
  --warn:     #fab219;   /* needs-work (and legacy "rejected" — same story: retry) */
  --shelf:    #9085e9;   /* shelved — kept on purpose, archival not shameful */
  --dead:     #d03b3b;   /* abandoned — work lost       */
  --pend:     #8a93a6;   /* in-flight / awaiting-panel  */
  --accent:   #3987e5;   /* interactive, focus, NEW, sparkline */
  --serious:  #ec835a;   /* errors, stale heartbeat     */
  --mono: ui-monospace, Consolas, monospace;
  --r-chip: 4px; --r-card: 6px; --r-dlg: 10px;
}
/* ============================ BASE ==================================== */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font: 400 13px/1.5 "Segoe UI", system-ui, sans-serif;
}
h1, h2, h3 { font-weight: 600; margin: 0; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--accent); }
img { display: block; }
.mono  { font-family: var(--mono); }
.num   { font-variant-numeric: tabular-nums; }
.dim   { color: var(--ink2); }
.faint { color: var(--ink3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip {
  position: absolute; left: -9999px; top: 8px; z-index: 99;
  background: var(--s2); padding: 8px 12px; border-radius: var(--r-chip);
}
.skip:focus-visible { left: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .pulse::before { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
}
/* ========================== COMPONENTS ================================ */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font: 600 11px/1 "Segoe UI", system-ui, sans-serif;
  padding: 4px 8px; border-radius: var(--r-chip); white-space: nowrap;
}
.badge .g { font-size: 12px; }
.v-accepted { color: var(--ok);    background: color-mix(in srgb, var(--ok) 14%, transparent); }
.v-needswork{ color: var(--warn);  background: color-mix(in srgb, var(--warn) 12%, transparent); }
.v-shelved  { color: var(--shelf); background: color-mix(in srgb, var(--shelf) 14%, transparent); }
.v-abandoned{ color: var(--dead);  background: color-mix(in srgb, var(--dead) 14%, transparent); }
.v-inflight, .v-awaiting, .v-unknown
            { color: var(--pend);  background: color-mix(in srgb, var(--pend) 14%, transparent); }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font: 400 11px/1 var(--mono); color: var(--ink2);
  background: var(--s2); border: 1px solid var(--line);
  padding: 3px 7px; border-radius: var(--r-chip); white-space: nowrap;
}
.chip b { font-weight: 600; color: var(--ink); }
.chip.audit { color: var(--ink3); }              /* the audit gates nothing — stays muted */
.chip.band-ok   b { color: var(--ok); }
.chip.band-warn b { color: var(--warn); }
.chip.band-low  b { color: var(--serious); }
.newdot {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--accent); font: 600 10px/1 "Segoe UI", system-ui, sans-serif;
}
.newdot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.starred { color: var(--warn); }
.crossed { color: var(--serious); }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-card); }
.empty {
  color: var(--ink2); text-align: center; padding: 32px 16px; font-size: 13px;
}
.banner {
  display: none; background: color-mix(in srgb, var(--serious) 14%, var(--canvas));
  color: var(--ink); padding: 6px 16px; font-size: 12px;
}
.banner.on { display: block; }
.skel { background: linear-gradient(90deg, var(--s1), var(--s2), var(--s1)); border-radius: var(--r-card); }
time { cursor: default; }
/* ========================== REGIONS =================================== */
/* --- health bar --- */
#health {
  position: sticky; top: 0; z-index: 5; height: 48px;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--s1); border-bottom: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none;
}
#health h1 { font-size: 15px; white-space: nowrap; }
#health select {
  background: var(--s2); color: var(--ink); border: 1px solid var(--line);
  border-radius: var(--r-chip); padding: 4px 6px; font: inherit; font-size: 12px;
}
.state-pill {
  display: inline-flex; align-items: center; gap: 6px; position: relative;
  font: 600 11px/1 var(--mono); padding: 4px 9px; border-radius: 999px;
}
.state-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.state-run   { color: var(--ok);   background: color-mix(in srgb, var(--ok) 12%, transparent); }
.state-pause { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.state-stop, .state-unknown { color: var(--ink3); background: var(--s2); }
.hb-ok    { color: var(--ok); }
.hb-warn  { color: var(--warn); }
.hb-stale { color: var(--serious); font-weight: 600; }
#hb-note { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#newpill { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
#newpill button {
  color: var(--accent); border: 1px solid var(--line); border-radius: var(--r-chip);
  padding: 4px 8px; font-size: 11px;
}
/* --- hero (current model) --- */
#hero { margin: 16px; padding: 16px; display: flex; gap: 20px; align-items: flex-start; }
#hero .shot { flex: 0 1 auto; }
#hero .shot img { max-height: 62vh; max-width: min(560px, 48vw); border-radius: var(--r-card); background: #000; cursor: zoom-in; }
#hero .meta { flex: 1 1 260px; min-width: 220px; display: flex; flex-direction: column; gap: 10px; }
#hero .meta h2 { font-size: 15px; }
#hero .meta p { margin: 0; color: var(--ink2); }
#hero .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* --- design lanes --- */
#lanes { margin: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.lane { padding: 12px 14px; }
.lane-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.lane-head .id { font: 600 13px/1 var(--mono); }
.lane-head .sum { color: var(--ink2); font-size: 12px; flex: 1 1 240px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-body { display: flex; gap: 4px; align-items: center; overflow-x: auto; padding-bottom: 4px; }
.conn { flex: 0 0 14px; height: 1px; background: var(--line); }
.node {
  flex: 0 0 auto; width: 104px; padding: 0; text-align: left;
  border-radius: var(--r-card); position: relative;
}
.node img, .node .noimg {
  width: 104px; height: 138px; object-fit: cover; border-radius: var(--r-card);
  background: #000; border: 2px solid transparent;
}
.node .noimg { display: flex; align-items: center; justify-content: center;
  color: var(--ink3); font-size: 11px; border-style: dashed; border-color: var(--line); }
.node.k-accepted  img { border-color: var(--ok); }
.node.k-needswork img { border-color: var(--warn); }
.node.k-shelved   img { border-color: var(--shelf); opacity: .75; }
.node.k-abandoned img { border-color: var(--dead); opacity: .6; }
.node.k-inflight img, .node.k-awaiting img, .node.k-inflight .noimg
  { border-color: var(--pend); border-style: dashed; }
.node .cap { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 0; font-size: 10px; }
.node .cap .l1 { display: flex; gap: 4px; align-items: center; overflow: hidden; }
.node .cap .l1 .chip { padding: 2px 5px; }
.node .when { color: var(--ink3); font-family: var(--mono); font-size: 10px; }
.node .flag { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; }
.spark { display: block; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark .band { fill: color-mix(in srgb, var(--ok) 8%, transparent); }
/* --- shelf --- */
#shelfwrap { margin: 0 16px 24px; }
#shelfwrap summary {
  cursor: pointer; color: var(--ink2); padding: 8px 4px; font-size: 13px;
}
#shelfwrap .entries { display: flex; flex-direction: column; gap: 10px; padding: 4px; }
.shelf-e { display: flex; gap: 12px; padding: 10px; align-items: flex-start; }
.shelf-e img { width: 72px; height: 96px; object-fit: cover; border-radius: var(--r-chip);
  background: #000; opacity: .65; cursor: zoom-in; }
.shelf-e .why { flex: 1; font-size: 12px; color: var(--ink2); }
.shelf-e .why .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; color: var(--ink); }
/* --- comparison (variants) mode --- */
#compare { display: none; }
#compare.on { display: block; }
.cols { display: flex; gap: 12px; padding: 16px; align-items: flex-start; overflow-x: auto; }
.col { padding: 10px; min-width: 220px; flex: 0 0 auto; }
.col h3 { font-size: 12px; margin-bottom: 2px; }
.col .diffvars { font: 11px/1.4 var(--mono); color: var(--ink2); margin: 6px 0 8px; white-space: pre-wrap; }
.col img { width: 100%; border-radius: var(--r-chip); margin-bottom: 8px; background: #000; cursor: zoom-in; }
.col.err { border-color: var(--serious); }
.col.err pre { font: 11px/1.4 var(--mono); color: #ffb4ae; background: #2a1614;
  padding: 8px; border-radius: var(--r-chip); margin: 0; max-height: 240px; overflow: auto; white-space: pre-wrap; }
.pending { color: var(--ink2); font-style: italic; padding: 20px 0; text-align: center; }
#history { margin: 0 16px; }
#history details { margin-bottom: 8px; }
#history summary { cursor: pointer; color: var(--ink2); padding: 4px 0; font-size: 12px; }
/* ========================== VIEWER ==================================== */
dialog { border: none; background: transparent; max-width: 98vw; max-height: 98vh; padding: 0; }
dialog::backdrop { background: #000d; }
/* No display on the base rule: it would override the UA's
   dialog:not([open]){display:none} and paint the closed dialog into the page
   flow as a 94vh blank block. Only the [open] state lays out. */
#viewer { color: var(--ink); font: 400 13px/1.5 "Segoe UI", system-ui, sans-serif;
  width: 96vw; height: 94vh; flex-direction: column; }
#viewer[open] { display: flex; }
.v-bar { display: flex; gap: 10px; align-items: center; padding: 8px 4px; flex-wrap: wrap; }
.v-bar .grow { flex: 1; }
.v-bar button, .v-bar [role="radio"] {
  background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-chip);
  padding: 8px 12px; font-size: 12px; min-width: 44px; min-height: 44px;
}
.v-bar [role="radio"][aria-checked="true"] { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.v-bar button:disabled { opacity: .35; cursor: not-allowed; }
#v-close { min-width: 44px; min-height: 44px; font-size: 16px; }
#v-main { flex: 1; display: flex; gap: 12px; min-height: 0; }
#v-stage { flex: 1; display: flex; gap: 10px; align-items: center; justify-content: center; min-width: 0; }
#v-stage img, #v-stage canvas { max-height: 100%; max-width: 100%; border-radius: var(--r-card); background: #000; }
.v-pane { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; max-height: 100%; }
.v-pane b { font: 400 11px/1.4 var(--mono); color: var(--ink2); }
.v-pane.half { max-width: 48%; }
.v-warn { color: var(--warn); font-size: 12px; padding: 20px; text-align: center; }
#v-rail { flex: 0 0 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px; }
#v-rail .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#v-rail .rep { background: var(--s2); border-radius: var(--r-chip); padding: 8px 10px;
  white-space: pre-wrap; font-size: 12px; color: var(--ink2); }
.crit { background: var(--s2); border-left: 2px solid var(--line); border-radius: var(--r-chip);
  padding: 8px 10px; font-size: 12px; }
.crit .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.crit .bars { display: flex; flex-direction: column; gap: 3px; margin: 6px 0; }
.crit .bar { display: grid; grid-template-columns: 64px 1fr 28px; gap: 6px; align-items: center; font-size: 10px; color: var(--ink2); }
.crit .bar i { height: 4px; border-radius: 2px; background: var(--accent); display: block; }
.crit .txt { white-space: pre-wrap; color: var(--ink2); max-height: 5.5em; overflow: hidden; }
.crit.open .txt { max-height: none; }
.crit .more { color: var(--accent); font-size: 11px; padding: 2px 0; }
#v-strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 2px; }
#v-strip button { flex: 0 0 auto; padding: 0; border-radius: var(--r-chip); position: relative; }
#v-strip .vg { position: absolute; left: 2px; bottom: 2px; font-size: 10px; line-height: 1;
  padding: 1px 3px; border-radius: 3px; background: #000c; }
.reactbtn { padding: 6px 10px; border-radius: var(--r-chip); font-size: 14px; }
.reactbtn[aria-pressed="true"] { background: var(--s2); border: 1px solid var(--line); }
.dirblock { background: var(--s2); border: 1px solid var(--line); border-radius: var(--r-chip);
  padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.dirbtn { border: 1px solid var(--line); border-radius: var(--r-chip); padding: 6px 10px;
  font-size: 12px; background: var(--s1); }
.dirbtn.confirm { color: var(--accent); border-color: var(--accent); }
.dirchip { color: var(--warn); }
.dirflag { color: var(--warn); font-size: 12px; background: #000c; border-radius: 3px; padding: 1px 3px; }
.dirblock input { background: var(--canvas); color: var(--ink); border: 1px solid var(--line);
  border-radius: var(--r-chip); padding: 6px 8px; font: inherit; font-size: 12px; width: 100%; }
.sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.imgbtn { padding: 0; border-radius: var(--r-card); display: block; }
#v-strip img { width: 48px; height: 64px; object-fit: cover; border-radius: var(--r-chip);
  background: #000; border: 2px solid transparent; }
#v-strip button[aria-current="true"] img { border-color: var(--ink); }
#v-strip .k-accepted img { border-color: var(--ok); }
#v-strip .k-shelved img { border-color: var(--shelf); }
#shortcuts { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-dlg);
  padding: 20px 24px; box-shadow: 0 8px 32px #000a; color: var(--ink); }
#shortcuts table { border-collapse: collapse; font-size: 12px; }
#shortcuts td { padding: 3px 12px 3px 0; color: var(--ink2); }
#shortcuts td:first-child { font-family: var(--mono); color: var(--ink); }
@media (max-width: 1100px) { #v-rail { display: none; } #hero { flex-direction: column; } }
</style>

<a class="skip" href="#lanes">skip to attempts</a>
<div id="net" class="banner">gallery server unreachable — showing the last good state</div>

<div id="announce" class="sr" role="status" aria-live="polite"></div>
<header id="health">
  <h1 id="h-title">waiting for a build…</h1>
  <select id="h-asset" aria-label="asset"></select>
  <span id="h-state" class="state-pill state-unknown">—</span>
  <span id="h-hb" class="chip num" title="orchestrator heartbeat age">hb —</span>
  <span id="h-counts" class="chip num">—</span>
  <span id="h-thresh" class="chip num" title="from control.json (user-owned, read-only)"></span>
  <span id="hb-note" class="faint"></span>
  <span id="newpill"><span id="h-new" class="newdot" hidden></span>
    <button id="h-seen" hidden>mark seen</button></span>
</header>

<main>
  <section id="hero" class="card" aria-label="current model" hidden></section>
  <section id="lanes" aria-label="design iterations"></section>
  <details id="shelfwrap" hidden><summary id="shelf-sum"></summary>
    <div class="entries" id="shelf"></div></details>
  <div id="compare"><div id="live"></div><div id="history"></div></div>
</main>

<dialog id="viewer" aria-modal="true" aria-labelledby="v-title">
  <div class="v-bar">
    <button id="v-close" data-keep aria-label="close viewer">✕</button>
    <span id="v-title" data-keep></span>
    <span class="grow"></span>
    <button id="v-prev" data-keep title="older attempt (←)">←</button>
    <button id="v-next" data-keep title="newer attempt (→)">→</button>
    <span role="radiogroup" aria-label="compare mode" id="v-modes" data-keep>
      <button role="radio" data-mode="single" aria-checked="true">single</button>
      <button role="radio" data-mode="side" aria-checked="false">side-by-side</button>
      <button role="radio" data-mode="diff" aria-checked="false">pixel diff</button>
    </span>
    <span role="radiogroup" aria-label="view" id="v-views" data-keep>
      <button role="radio" data-view="hero_34" aria-checked="true">hero ¾</button>
      <button role="radio" data-view="front" aria-checked="false">front</button>
      <button role="radio" data-view="icon_full_184" aria-checked="false">icon</button>
    </span>
    <button id="v-help" data-keep title="keyboard shortcuts (?)">?</button>
  </div>
  <div id="v-main">
    <div id="v-stage"></div>
    <aside id="v-rail" data-keep aria-label="attempt details"></aside>
  </div>
  <div id="v-strip" data-keep aria-label="attempts filmstrip"></div>
</dialog>

<dialog id="shortcuts" aria-label="keyboard shortcuts">
  <h2 style="margin-bottom:10px">Keyboard <button id="sc-close" aria-label="close"
    style="float:right;padding:4px 10px">✕</button></h2>
  <table>
    <tr><td>← →</td><td>older / newer attempt</td></tr>
    <tr><td>Home End</td><td>first / latest attempt</td></tr>
    <tr><td>1 S D</td><td>single · side-by-side · pixel diff</td></tr>
    <tr><td>2 3 4</td><td>hero · front · icon view</td></tr>
    <tr><td>Esc</td><td>close</td></tr>
    <tr><td>?</td><td>this help</td></tr>
  </table>
</dialog>

<script>
'use strict';
/* ============================ utils =================================== */
const $ = id => document.getElementById(id);
const q = p => p + (p.includes('?') ? '&' : '?') + 't=' + Date.now();  // JSON only — never images
const esc = s => String(s ?? '').replace(/[<&]/g, c => ({'<':'&lt;','&':'&amp;'}[c]));
function h(tag, attrs, ...kids) {          // tiny element builder — avoids innerHTML injection
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const k of kids) if (k) el.appendChild(typeof k === 'string' ? document.createTextNode(k) : k);
  return el;
}
/* ========================= normalize ================================== */
// The ONLY code that touches raw log JSON. Everything downstream consumes its
// output. Tolerate every era; never require undocumented fields; never crash.
const VCLASS = {
  'accepted': 'accepted', 'needs-work': 'needswork', 'rejected': 'needswork',
  'shelved': 'shelved', 'abandoned': 'abandoned',
  'in-flight': 'inflight', 'awaiting-panel': 'awaiting',
};
const VGLYPH = { accepted: '✓', needswork: '↻', shelved: '⇣', abandoned: '⚠',
                 inflight: '◌', awaiting: '◌', unknown: '·' };
function normalize(raw) {
  const attempts = (Array.isArray(raw.attempts) ? raw.attempts : []).map((a, i) => {
    const render = typeof a.render === 'string' ? a.render : null;
    const runM = render && render.match(/run-(\d+)/);
    const critiques = (Array.isArray(a.critiques) ? a.critiques : []).map(c => ({
      verifier: c.verifier ?? '?',
      score: Number.isFinite(c.score) ? c.score : null,
      sub: (c.sub && typeof c.sub === 'object') ? c.sub : null,
      stance: typeof c.stance === 'string' ? c.stance : null,
      prefer: typeof c.prefer === 'string' ? c.prefer : null,
      margin: Number.isFinite(c.margin) ? c.margin : null,
      text: typeof c.text === 'string' ? c.text : '',
    }));
    return {
      key: a.id || render || 'row' + i,
      id: a.id || null, design: a.design || null,
      attempt: Number.isFinite(a.attempt) ? a.attempt : null,
      summary: typeof a.summary === 'string' ? a.summary : '',
      render, runN: runM ? +runM[1] : null,
      diff: a.diff || null, audit: a.audit || null,
      verdictRaw: a.verdict || 'in-flight',
      k: VCLASS[a.verdict] || (a.verdict ? 'unknown' : 'inflight'),
      total: Number.isFinite(a.total) ? a.total : null,

  else if (e.key === '2') { S.vView = 'hero_34'; renderViewer(); }
  else if (e.key === '3') { S.vView = 'front'; renderViewer(); }
  else if (e.key === '4') { S.vView = 'icon_full_184'; renderViewer(); }
  else return;
  e.preventDefault();
});
/* ========================== poller ==================================== */
function render(force) {
  if (!S.log) return;
  if (force) { S.heroSig = null; S.laneSigs.clear(); }
  renderHealth(S.log);
  renderHero(S.log);
  renderLanes(S.log);
}
async function findAsset() {
  const override = new URLSearchParams(location.search).get('asset');
  if (override) return override;
  try {
    const res = await fetch(q('/assets.json'));
    if (!res.ok) return null;
    const list = await res.json();
    return list.length ? list[0] : null;
  } catch (e) { return null; }
}
function populateSwitcher(list) {
  const sel = $('h-asset');
  // Compare against what sel.value is actually set to ('' = "newest"): the old
  // S.asset comparison never matched, so the options were torn down every tick
  // and the open dropdown collapsed under the cursor.
  const param = new URLSearchParams(location.search).get('asset') || '';
  const want = JSON.stringify(list);
  if (sel.dataset.sig === want && sel.value === param) return;
  sel.dataset.sig = want;
  sel.textContent = '';
  sel.appendChild(h('option', { value: '', text: 'newest' }));
  for (const a of list) sel.appendChild(h('option', { value: a, text: a }));
  sel.value = new URLSearchParams(location.search).get('asset') || '';
}
$('h-asset').addEventListener('change', e => {
  const v = e.target.value;
  const u = new URL(location.href);
  if (v) u.searchParams.set('asset', v); else u.searchParams.delete('asset');
  history.replaceState(null, '', u);
});
let tickN = 0, ticking = false;
async function tick() {
  if (ticking) return;                 // a slow tick must not interleave with the next
  ticking = true;
  try { await tickBody(); } finally { ticking = false; }
}
async function tickBody() {
  tickN++;
  try {
    try {
      const res = await fetch(q('/assets.json'));
      if (res.ok) populateSwitcher(await res.json());
    } catch (e) {}
    const next = await findAsset();
    if (!next) { if (S.asset !== null) $('net').classList.add('on'); return; }
    if (next !== S.asset) {          // full reset — all view state derives from the asset
      if (S.log) commitSeen(S.asset, S.log);
      S.asset = next; S.log = null; S.logText = null; S.latestText = null; S.lastRun = null;
      S.control = null; S.heroSig = null; S.laneSigs.clear(); marks.clear();
      directives.clear(); S.vCompose = null;
      rtQueue = [];                  // queued manifest fetches belong to the old asset
      $('lanes').textContent = ''; $('live').textContent = ''; $('history').textContent = '';
      $('compare').classList.remove('on');
      $('h-title').textContent = next + ' · loading…';
      $('h-hb').textContent = ''; $('hb-note').textContent = ''; $('h-thresh').textContent = '';
      $('h-new').hidden = $('h-seen').hidden = true;
      pollSignals();
    }
    if (tickN % 5 === 1) {
      try {
        const c = await fetch(q(`/${S.asset}/control.json`));
        S.control = c.ok ? await c.json() : null;
      } catch (e) {}
      pollSignals();
    }
    const myAsset = S.asset;           // discard any response landing after a switch
    const logRes = await fetch(q(`/${myAsset}/iteration-log.json`)).catch(() => null);
    if (myAsset !== S.asset) return;
    if (logRes && logRes.ok) {
      $('net').classList.remove('on');
      const text = await logRes.text();
      if (myAsset !== S.asset) return;
      $('compare').classList.remove('on');
      if (text !== S.logText) {
        let raw;
        try { raw = JSON.parse(text); }
        catch (e) { return; }        // half-written read — keep the last good render
        S.logText = text;
        S.log = normalize(raw);
        S.seen = loadSeen(S.asset, S.log);
        render(false);
        // keep the open rail's ack status fresh — but never mid-compose
        if ($('viewer').open && !S.vBare && !S.vCompose) renderViewer();
      }
      refreshTimes();
      return;
    }
    // no iteration log — comparison/variants mode
    const res = await fetch(q(`/${myAsset}/latest.json`)).catch(() => null);
    if (myAsset !== S.asset) return;
    if (!res || !res.ok) {
      if (!logRes && !res) $('net').classList.add('on');   // both fetches failed outright
      return;
    }
    $('net').classList.remove('on');
    const body = await res.text();
    if (myAsset !== S.asset || body === S.latestText) { refreshTimes(); return; }
    let m;
    try { m = JSON.parse(body); } catch (e) { return; }
    S.latestText = body;
    renderComparison(m);
  } catch (e) {
    $('net').classList.add('on');
  }
}
tick();
setInterval(tick, 1000);
</script>
