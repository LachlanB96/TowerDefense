<!doctype html>
<!-- Gloomfell live view.

     Separate from index.html on purpose. index.html gives the whole page to
     iteration-log.json whenever that file exists ("owns the page when present", per
     its own header comment), so a live pane added there would be invisible on any
     asset that has a log — which is every asset that has ever been worked on.

     Reads <asset>/live.json, published by _tools/tap.py from its own process. Polling
     a static file rather than holding a stream open: the server must never have a
     request that does not return, and a tap crash must not be able to take the
     gallery down with it.

     WHAT IS SHOWN: every render, including the ones no attempt ever claimed. Measured
     403 run directories against 84 logged attempts, so four out of five renders were
     paid for and never seen. Unclaimed runs are the discarded intermediates — the
     thing this page exists to surface — and they are marked, not hidden.

     WHAT IS NOT SHOWN: a judge mid-verdict. Watching a referee think invites steering
     it, and the blind comparison is the one instrument here with a passing calibration
     probe behind it. Verdicts appear once they land; reasoning does not stream. -->
<meta charset="utf-8">
<title>Gloomfell — live</title>
<style>
  :root{
    --bg:#12151c; --panel:#181c25; --panel2:#1e2331; --line:#2b3242;
    --ink:#e3e7f0; --ink2:#a8b0c2; --mute:#6f7891;
    --accent:#8e9bee; --ok:#5fbe99; --warn:#d2a05c;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
         border-bottom:1px solid var(--line);padding:12px 18px;
         display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  h1{font:600 14px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
     margin:0;color:var(--accent)}
  .stat{font:11px/1 var(--mono);color:var(--mute);letter-spacing:.06em}
  .stat b{color:var(--ink);font-weight:600}
  #dot{width:7px;height:7px;border-radius:50%;background:var(--mute);
       display:inline-block;margin-right:6px;vertical-align:1px}
  #dot.on{background:var(--ok)}
  #dot.err{background:var(--warn)}
  main{padding:14px 18px 60px}
  .run{border:1px solid var(--line);border-radius:4px;background:var(--panel);
       margin-bottom:10px;overflow:hidden}
  .run.unclaimed{opacity:.72;border-style:dashed}
  .rhead{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
         padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);
         font:11px/1.4 var(--mono);letter-spacing:.05em}
  .rn{color:var(--accent);font-weight:700}
  .tag{color:var(--ok)}
  .untag{color:var(--mute);font-style:italic}
  .seed{color:var(--ink2)}
  .when{margin-left:auto;color:var(--mute)}
  .shots{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}
  .shot{flex:0 0 auto;text-align:center}
  .shot img{height:150px;width:auto;display:block;border-radius:3px;
            background:#0c0e13;border:1px solid var(--line)}
  .shot span{display:block;font:10px/1.6 var(--mono);color:var(--mute);
             max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .none{padding:10px 12px;color:var(--mute);font:11px var(--mono)}
  #err{display:none;padding:10px 14px;margin:0 18px 12px;border-radius:4px;
       background:#2e2718;color:var(--warn);font:12px var(--mono)}
  #big{position:fixed;inset:0;background:#080a0ee6;display:none;z-index:20;
       align-items:center;justify-content:center;cursor:zoom-out}
  #big img{max-width:96vw;max-height:92vh;border-radius:4px}
  #big div{position:fixed;bottom:14px;left:0;right:0;text-align:center;
           font:11px var(--mono);color:var(--ink2)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Gloomfell live</h1>
  <span class="stat"><span id="dot"></span><b id="asset">—</b></span>
  <span class="stat">runs <b id="nruns">—</b></span>
  <span class="stat">unclaimed <b id="nunc">—</b></span>
  <span class="stat">updated <b id="stamp">—</b></span>
  <span class="stat" style="margin-left:auto">unclaimed = rendered, never attributed to an attempt</span>
</header>
<div id="err"></div>
<main id="runs"></main>
<div id="big"><img alt=""><div></div></div>

<script>
// Asset comes from ?asset=NAME so two pipelines can be watched in two tabs.
const ASSET = new URLSearchParams(location.search).get('asset') || 'mage000';
const POLL_MS = 1000;

const $ = id => document.getElementById(id);
let lastStamp = null, failures = 0;

function esc(s){ return String(s ?? '').replace(/[<>&"]/g, c =>
  ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function shotEl(run, path){
  const d = document.createElement('div');
  d.className = 'shot';
  const img = document.createElement('img');
  // Cache-bust on the run's own identity, not on every poll: a render is written once
  // and never edited, so re-fetching it each second would be pure waste.
  img.src = `${ASSET}/${path}`;
  img.loading = 'lazy';
  img.alt = path;
  img.onclick = () => {
    $('big').style.display = 'flex';
    $('big').querySelector('img').src = img.src;
    $('big').querySelector('div').textContent = `run-${run} · ${path}`;
  };
  d.appendChild(img);
  const s = document.createElement('span');
  s.textContent = path.split('/').pop();
  d.appendChild(s);
  return d;
}

function render(data){
  $('asset').textContent = data.asset;
  $('nruns').textContent = data.total_runs;
  $('nunc').textContent = data.unclaimed_runs;
  $('stamp').textContent = (data.stamped || '').replace('T', ' ');

  const host = $('runs');
  host.textContent = '';
  for (const r of data.runs){
    const el = document.createElement('section');
    el.className = 'run' + (r.claimed ? '' : ' unclaimed');

    const h = document.createElement('div');
    h.className = 'rhead';
    const shots = r.variants.reduce((n, v) => n + v.shots.length, 0);
    h.innerHTML =
      `<span class="rn">run-${esc(r.run)}</span>` +
      (r.claimed ? `<span class="tag">${esc(r.tag)}</span>`
                 : `<span class="untag">unclaimed</span>`) +
      (r.seed != null ? `<span class="seed">seed ${esc(r.seed)}</span>` : '') +
      `<span class="seed">${shots} shot${shots === 1 ? '' : 's'}</span>` +
      (r.done === false ? `<span class="tag">rendering…</span>` : '') +
      (r.audit ? `<span class="seed">audit ${esc(r.audit)}</span>` : '') +
      `<span class="when">${esc(r.started || '')}</span>`;
    el.appendChild(h);

    const all = r.variants.flatMap(v => v.shots);
    if (!all.length){
      const n = document.createElement('div');
      n.className = 'none';
      n.textContent = 'no images on disk for this run';
      el.appendChild(n);
    } else {
      const strip = document.createElement('div');
      strip.className = 'shots';
      for (const p of all) strip.appendChild(shotEl(r.run, p));
      el.appendChild(strip);
    }
    host.appendChild(el);
  }
}

async function tick(){
  try {
    const res = await fetch(`${ASSET}/live.json?t=${Date.now()}`, {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    failures = 0;
    $('dot').className = 'on';
    $('err').style.display = 'none';
    // Only re-render when the tap actually republished. Rebuilding the DOM every second
    // would restart every lazy image load and make the strip flicker.
    if (data.stamped !== lastStamp){ lastStamp = data.stamped; render(data); }
  } catch (e) {
    failures++;
    $('dot').className = 'err';
    // Say loudly that the feed is missing rather than showing an empty page, which
    // would read as "nothing is happening" when it means "nothing is watching".
    if (failures > 2){
      $('err').style.display = 'block';
      $('err').textContent =
        `live feed unavailable (${e.message}). Is the tap running?  ` +
        `python Assets/Blender/_tools/tap.py ${ASSET}`;
    }
  }
}

$('big').onclick = () => { $('big').style.display = 'none'; };
addEventListener('keydown', e => { if (e.key === 'Escape') $('big').style.display = 'none'; });
tick();
setInterval(tick, POLL_MS);
</script>
